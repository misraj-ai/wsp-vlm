# Shared by every experiment and condition. Everything not set here takes the defaults in wsp/config.py.
# Keep model, protocol, tasks and grading identical across everything you compare.

weights_cache: cache/base_weights   # base weights exported once, shared read-only by every run

model:
  path: <hf-id-or-local-dir> # the ~1B VLM (chosen after the pilot)
  revision: <commit-sha>     # pin it: the evaluation machine checks the base weights' hashes
  dtype: bfloat16
  device: cuda
  trust_remote_code: false
  attn_implementation: null  # "eager" to allow attention-pattern reads (slower)
  chat_template_kwargs: {}   # e.g. {enable_thinking: false} for Qwen3.5-style templates
  discovery: {}              # regex overrides if discovery picks the wrong modules (see README)

# Fixed BEFORE any agent run with scripts/agent/decode_sweep.py; frozen into every bundle.
protocol:
  max_new_tokens: 4096
  do_sample: false
  repetition_penalty: 1.0
  no_repeat_ngram_size: 0
  image_max_side: 1540
  batch_size: 16
  seed: 0
  system_prompt: null

# ALL task definitions. Each experiment picks its tasks; the evaluation machine tests all of them.
tasks:
  ocr:
    description: "printed-text OCR (transcribing printed document images)"
    prompt: "Extract all the text in this image, in reading order. Output plain text only."
    metric: cer
  arabic:
    description: "reading Arabic documents"
    prompt: "استخرج كل النص الموجود في الصورة بترتيب القراءة. أخرج النص فقط."
    metric: cer
    arabic: true
  table:
    description: "extracting tables from document images"
    prompt: "Extract the table in this image as HTML. Use <th> for header cells."
    metric: table
  handwriting:
    description: "reading handwriting"
    prompt: "Transcribe the handwritten text in this image exactly. Output plain text only."
    metric: cer
    arabic: true

grading:
  arabic_norm:               # decide once, before the pilot; see wsp/grading.py DEFAULT_NORM
    remove_diacritics: true
    ta_marbuta: false
    digits: western
  loop: {tail_words: 200, ngram: 6, dup_threshold: 0.5}

practice:
  dir: data/public           # <task>.jsonl + images. PUBLIC data only: a folder with a PRIVATE marker is refused
  dev_fraction: 0.5

budget:
  passes: 25
  python_runs: 300
  max_turns: 400
  max_failed_requests: 40
  must_use_all_passes: true
  explain_every_step: true

limits:
  gen_max_items: 256
  gen_both_max_items: 128
  tf_max_items: 256
  tf_max_tokens_total: 400000
  kernel_timeout_s: 900

editing:
  allow_vision: true
  allow_connector: true
  frozen_patterns: []
  refuse_rescale: true

kernel:
  sandbox: bwrap             # required for real runs (see wsp/sandbox.py)
  mem_gb: 96
  extra_ro_binds: []         # e.g. a conda/venv path outside /usr, if the kernel's Python lives there

agent:
  backend: anthropic         # anthropic | openrouter | openai_compat | scripted
  model: claude-opus-5-5
  max_tokens: 32000
  extra: {}                  # passed to the API call as-is: put the reasoning/effort setting for your model here
  handoff_every_turns: 40
